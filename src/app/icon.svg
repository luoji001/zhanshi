<!--
  站点图标：字形「珞」，**已转成矢量轮廓**，不是文字元素。
  （下面这段注释刻意不写出 text 标签的字面量：有些 SVG 清洗工具会用正则剥掉
   文字元素，注释里带着尖括号有被误伤的风险。）

  为什么不用文字元素：favicon 由浏览器独立渲染，**加载不了 web font**，
  于是字形完全取决于访客机器上装了什么字体 —— 实测同一份 SVG，
  声明字体栈与不声明渲染出来的粗细就不一样，各系统还会各自回退。
  转成路径后任何机器上渲染都完全一致。

  轮廓取自 Hiragino Sans GB W6（粗黑体，与原先 font-weight:700 的观感最接近），
  用 fontTools 的 SVGPathPen 提取，再按墨迹包围盒等比缩放、
  **几何居中**到 64 方格（比原来的手填基线 y="42" 可靠：基线偏移量本身随字体变）。

  墨迹高度占 48.4%（31/64）。原先是 26px 字号，实测只占 39.1% —— 标签页按 16×16
  渲染时四周全是空的，糊成一个白点。改大小只需调下面 transform 的 scale。
-->
